apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: platformdb-postgres
  namespace: kafka
  labels:
    strimzi.io/cluster: data-platform-connect

spec:
  class: io.debezium.connector.postgresql.PostgresConnector

  tasksMax: 1

  config:
    database.hostname: data-platform-postgres-rw.database.svc.cluster.local
    database.port: 5432
    database.user: debezium
    database.password: REPLACE_WITH_SECRET
    database.dbname: platformdb

    plugin.name: pgoutput

    slot.name: platformdb_debezium
    publication.name: dbz_publication
    publication.autocreate.mode: disabled

    topic.prefix: platformdb

    schema.include.list: public
    table.include.list: public.customers

    snapshot.mode: initial
